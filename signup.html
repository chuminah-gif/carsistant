<div class="container auth-wrap">
  <div class="card">
    <h2>회원가입</h2>
    <p class="card-sub">회원가입하면 내 차를 등록하고 정비 이력·비용, 다가오는 정비 일정을 관리할 수 있습니다.</p>

    <form id="signupForm">
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="6자 이상 입력해 주세요" minlength="6" required />
      </div>
      <div class="field">
        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password" id="passwordConfirm" placeholder="비밀번호를 한 번 더 입력해 주세요" minlength="6" required />
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">회원가입</button>
    </form>
    <div id="formResult"></div>

    <p class="auth-switch">이미 계정이 있으신가요? <a href="login.html">로그인</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById("signupForm").addEventListener("submit", function (e) {
  e.preventDefault();

  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;
  var passwordConfirm = document.getElementById("passwordConfirm").value;
  var resultBox = document.getElementById("formResult");
  var submitBtn = document.getElementById("submitBtn");

  resultBox.innerHTML = "";

  if (password.length < 6) {
    resultBox.innerHTML = '<div class="error-box">비밀번호는 6자 이상이어야 합니다.</div>';
    return;
  }
  if (password !== passwordConfirm) {
    resultBox.innerHTML = '<div class="error-box">비밀번호가 일치하지 않습니다.</div>';
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "가입 처리 중...";

  supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: { emailRedirectTo: window.location.origin + "/login.html" }
  }).then(function (res) {
    submitBtn.disabled = false;
    submitBtn.textContent = "회원가입";

    if (res.error) {
      resultBox.innerHTML = '<div class="error-box">' + translateAuthError(res.error.message) + '</div>';
      return;
    }

    if (res.data.session) {
      resultBox.innerHTML = '<div class="success-box">가입이 완료되었습니다. 내 차고로 이동합니다...</div>';
      window.location.href = "dashboard.html";
    } else {
      resultBox.innerHTML = '<div class="success-box">가입 확인 이메일을 보내드렸습니다. 메일함에서 확인 링크를 눌러 가입을 완료해 주세요.</div>';
      document.getElementById("signupForm").reset();
    }
  });
});

function translateAuthError(message) {
  var map = {
    "User already registered": "이미 가입된 이메일입니다. 로그인을 이용해 주세요.",
    "Password should be at least 6 characters": "비밀번호는 6자 이상이어야 합니다.",
    "Unable to validate email address: invalid format": "올바른 이메일 형식이 아닙니다.",
    "Invalid login credentials": "이메일 또는 비밀번호가 올바르지 않습니다."
  };
  return map[message] || ("오류가 발생했습니다: " + message);
}
</script>
