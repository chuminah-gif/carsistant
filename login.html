<div class="container auth-wrap">
  <div class="card">
    <h2>로그인</h2>
    <p class="card-sub">등록해두신 내 차 정보와 정비 이력을 확인하려면 로그인해 주세요.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" placeholder="비밀번호" required />
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">로그인</button>
    </form>
    <div id="formResult"></div>

    <p class="auth-switch">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", function (e) {
  e.preventDefault();

  var email = document.getElementById("email").value.trim();
  var password = document.getElementById("password").value;
  var resultBox = document.getElementById("formResult");
  var submitBtn = document.getElementById("submitBtn");

  resultBox.innerHTML = "";
  submitBtn.disabled = true;
  submitBtn.textContent = "로그인 중...";

  supabaseClient.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
    submitBtn.disabled = false;
    submitBtn.textContent = "로그인";

    if (res.error) {
      resultBox.innerHTML = '<div class="error-box">' + translateAuthError(res.error.message) + '</div>';
      return;
    }

    window.location.href = "dashboard.html";
  });
});

function translateAuthError(message) {
  var map = {
    "Invalid login credentials": "이메일 또는 비밀번호가 올바르지 않습니다.",
    "Email not confirmed": "이메일 인증이 완료되지 않았습니다. 가입 시 받은 확인 메일을 먼저 확인해 주세요."
  };
  return map[message] || ("오류가 발생했습니다: " + message);
}
</script>
